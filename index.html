<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Still Standing</title>
    <meta name="description" content="Drop a photo. Get a few seconds of footage where nobody moved." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d0d10'/%3E%3Crect x='7' y='10' width='13' height='12' rx='2' fill='%23e8e2d4'/%3E%3Cpath d='M21 14l5-3v10l-5-3z' fill='%23e8e2d4'/%3E%3C/svg%3E"
    />
    
  <link rel="preload" href="/projector.stl.gz" as="fetch" crossorigin="anonymous" />
  <script type="module" crossorigin src="/assets/index-DNJ4G_4s.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-z_3GVSmu.css">
</head>
  
  <body class="parked lit">
    
    <div id="fit">

    
    <div class="room" aria-hidden="true">
      
      <div class="camera">
      <div class="ceiling"></div>
      <div class="wall"><div class="wall-dim"></div><div class="wall-spill"></div><div class="cornice"></div><div class="skirting"></div></div>
      
      <div class="sidewall sidewall-left"><div class="cornice"></div><div class="skirting"></div></div>
      <div class="sidewall sidewall-right"><div class="cornice"></div><div class="skirting"></div></div>
      <div class="floor">
        
        <div class="floor-light"></div>
      </div>

      
      <div class="table" aria-hidden="true">
        <div class="tb-top"></div>
        <div class="tb-side tb-left"></div>
        <div class="tb-side tb-right"></div>
        <div class="tb-in tb-in-left"></div>
        <div class="tb-in tb-in-right"></div>
        <div class="tb-shelf"></div>
        
        <div class="tb-rim tb-rim-back"></div>
        <div class="tb-rim tb-rim-front"></div>
        <i class="tb-leg tb-leg-bl"><b></b></i>
        <i class="tb-leg tb-leg-br"><b></b></i>
        <i class="tb-leg tb-leg-fl"><b></b></i>
        <i class="tb-leg tb-leg-fr"><b></b></i>
      </div>

      
      <div class="projector">
        
        <img class="pj-photo" src="/projector.png" alt="" aria-hidden="true" />
        <div class="pj">
          
          <div class="pj-face pj-rear">
            
            <div class="pj-strip"><i class="pj-logo"></i><i class="pj-mark"></i></div>

            <div class="pj-panel">
              <span class="pj-dial pj-dial-a"></span>
              <span class="pj-dial pj-dial-b"></span>
              
              <div class="pj-advance"><i></i><i></i></div>
              
              <span class="pj-selector"><i></i></span>
              <span class="pj-slot"></span>
            </div>

            <div class="pj-vent"></div>
            <span class="pj-lamp"></span>
            <button id="pj-power" class="pj-power" type="button" tabindex="-1" aria-hidden="true">
              <span class="pj-power-rocker"></span>
            </button>
          </div>

          <div class="pj-face pj-top"><span class="pj-topvent"></span></div>
          <div class="pj-face pj-left"></div>
          <div class="pj-face pj-right"></div>
          <div class="pj-face pj-fore"></div>

          
          <div class="pj-hood">
            <i class="hd-top"></i>
            <i class="hd-face"></i>
            <span class="pj-knob pj-knob-a"></span>
            <span class="pj-knob pj-knob-b"></span>
          </div>

          
          <div class="pj-reels">
            <span class="pj-arm pj-arm-a"></span>
            <span class="pj-arm pj-arm-b"></span>
            <span class="pj-reel pj-reel-a">
              <i class="rl-back"></i><i class="rl-film"></i><i class="rl-front"></i><i class="rl-hub"></i>
            </span>
            <span class="pj-reel pj-reel-b">
              <i class="rl-back"></i><i class="rl-film"></i><i class="rl-front"></i><i class="rl-hub"></i>
            </span>
          </div>
          <div class="pj-barrel"></div>
        </div>
      </div>
      </div>

      
      <div class="houselight"></div>
      <div class="vignette"></div>

      <div class="grain"></div>
    </div>

    
    <div class="beam-layer" aria-hidden="true">
      
      <div class="beam-cone" aria-hidden="true"><i class="beam-tint"></i></div>

      
      <div class="beam-dust" aria-hidden="true">
        <div class="bd-clip">
          <i class="bd-fine"></i>
          <i class="bd-mid"></i>
          <i class="bd-near"></i>
        </div>
      </div>
    </div>

    
    <h1>Still Standing</h1>

    
    <p class="credit">3D projector: Syzguru11 (CC BY)</p>

    
    <div id="powerlead" class="powerlead" aria-hidden="true"></div>
    <button id="power" class="callout" type="button">
      <span class="callout-title">Switch on the projector</span>
      <span class="callout-hint">and pick a photo</span>
    </button>

    
    <div id="wired" class="wired">
      <span class="lead lead-cube" aria-hidden="true"></span>
      <button id="newphoto" class="tap" type="button">Choose another photo</button>

      <span class="lead lead-vent" aria-hidden="true"></span>
      <button id="mutePreview" class="tap mute-toggle" type="button" hidden>Mute</button>

      <span class="lead lead-advance" aria-hidden="true"></span>
      <button id="playpause" class="tap" type="button" hidden>Pause</button>

      <span class="lead lead-power" aria-hidden="true"></span>
      <button id="poweroff" class="tap tap-off" type="button" hidden>Turn the projector off</button>
    </div>

    
    <div id="remote" class="remote">
      <span class="remote-cord" aria-hidden="true"></span>
      <div id="actions" class="actions" hidden>
        <button id="generate" class="primary">Bring it to life</button>
        <span id="length" class="length" hidden>
          <button class="len" data-repeats="1">6s</button>
          <button class="len" data-repeats="2">12s</button>
          <button class="len" data-repeats="3">18s</button>
        </span>
        <button id="make" class="primary" hidden>Make the video</button>
        <button id="makegif" hidden>Make a GIF</button>
        <progress id="progress" max="1" value="0" hidden></progress>
      </div>
    </div>

    <main id="app">
      
      <div class="gallery">
        <figure class="sample">
          <video src="/examples/q660.mp4" poster="/examples/q660.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
        <figure class="sample">
          <video src="/examples/q823.mp4" poster="/examples/q823.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
        <figure class="sample">
          <video src="/examples/p1015.mp4" poster="/examples/p1015.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
        <figure class="sample">
          <video src="/examples/q342.mp4" poster="/examples/q342.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
        <figure class="sample wide-only">
          <video src="/examples/q1059.mp4" poster="/examples/q1059.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
        <figure class="sample wide-only">
          <video src="/examples/p1036.mp4" poster="/examples/p1036.jpg" autoplay muted loop playsinline preload="auto"></video>
        </figure>
      </div>

      
      <div id="drop" class="drop">
        <span class="drop-roller"></span>
        <span class="drop-fabric"></span>
        <span class="drop-pull"></span>
      </div>
      <input id="file" type="file" accept="image/*" hidden />

      <button id="gate" class="stage screen gate" type="button" hidden>
        <span class="gate-title">Choose a photo</span>
        <span class="gate-hint">or drag one onto the screen</span>
      </button>

      
      <div id="stage" class="stage screen" hidden>
        <canvas id="canvas"></canvas>
        <button id="compare" hidden>Hold to see the original</button>
        <span class="screen-shade" aria-hidden="true"></span>
      </div>

      <div id="working" class="working" hidden>
        <p id="working-label">Measuring depth</p>
        <progress id="working-bar" max="1" value="0"></progress>
        <output id="working-pct">0%</output>
      </div>


      <div id="result" class="result" hidden>
        
        <div class="screen">
          <video id="video" playsinline autoplay muted loop></video>
          <img id="gifimg" alt="Your clip as an animated GIF" hidden />
          <span class="screen-shade" aria-hidden="true"></span>
        </div>
        <p id="filesize" class="filesize" role="status" hidden></p>
        <div class="actions">
          <button id="mute" class="mute-toggle ghost">Mute</button>
          <button id="download" class="primary">Save the video</button>
          <button id="share" hidden>Share</button>
          <button id="again" class="ghost">Back to the clip</button>
        </div>
      </div>

      
      <p id="error" class="error" role="status" hidden></p>
      <p id="diag" class="diag" hidden></p>
    </main>
    </div>

  </body>
</html>
